<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solez-N-Toez • Premium Feet Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('hero.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
        }
        .card {
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- Simple Navbar -->
    <nav class="bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-shoe-prints text-4xl text-pink-500"></i>
                <h1 class="text-3xl font-bold tracking-tight">Solez-N-Toez</h1>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <div class="hero-bg flex items-center">
        <div class="max-w-4xl mx-auto text-center px-6">
            <h2 class="text-6xl md:text-7xl font-bold mb-6">Solez-N-Toez</h2>
            <p class="text-2xl text-zinc-300 mb-10">Exclusive Premium Feet Content</p>
            <button onclick="document.getElementById('featured').scrollIntoView({ behavior: 'smooth' })" 
                    class="px-10 py-4 bg-white text-black rounded-full text-xl font-semibold hover:bg-zinc-100">
                View Models
            </button>
        </div>
    </div>

    <!-- Featured Models -->
    <div id="featured" class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-4xl font-bold text-center mb-4">$4.99 per set • 10 photos each</h2>
        <p class="text-center text-zinc-400 mb-12">Click any model to view details</p>
        
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="models-grid"></div>

        <!-- More Models Message -->
        <div class="mt-16 text-center">
            <p class="text-2xl font-semibold text-pink-400">More models to come!</p>
            <p class="text-zinc-400 mt-2">Check back soon for new updates 🔥</p>
        </div>
    </div>

    <!-- Model Detail Modal -->
    <div id="model-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl max-w-lg w-full mx-4 overflow-hidden">
            <div id="modal-image" class="h-80 bg-zinc-800"></div>
            
            <div class="p-8">
                <h2 id="modal-name" class="text-3xl font-bold mb-1"></h2>
                <p id="modal-title" class="text-pink-400 mb-6"></p>
                
                <div id="modal-description" class="text-zinc-300 leading-relaxed mb-8 space-y-3"></div>

                <button onclick="showPayment()" 
                        class="w-full bg-pink-600 hover:bg-pink-500 py-4 rounded-2xl text-lg font-semibold mb-4">
                    Buy This Set - $4.99
                </button>
                
                <button onclick="closeModal()" 
                        class="w-full py-4 text-zinc-400 hover:text-white">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl max-w-md w-full mx-4 p-8">
            <h3 class="text-2xl font-bold mb-6 text-center">Complete Purchase</h3>
            <p id="payment-model" class="text-center text-zinc-400 mb-8"></p>
            
            <div class="space-y-4 mb-8">
                <input type="text" placeholder="Card Number" class="w-full bg-zinc-800 p-4 rounded-2xl">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="MM/YY" class="bg-zinc-800 p-4 rounded-2xl">
                    <input type="text" placeholder="CVC" class="bg-zinc-800 p-4 rounded-2xl">
                </div>
            </div>
            
            <button onclick="completePurchase()" 
                    class="w-full bg-white text-black py-4 rounded-2xl font-semibold mb-4">
                Pay $4.99 Securely
            </button>
            
            <button onclick="closePayment()" class="w-full text-zinc-400 hover:text-white py-3">
                Cancel
            </button>
        </div>
    </div>

    <script>
        const models = [
            {
                name: "Lacy",
                title: "Size 7 • 10 Photo Set",
                img: "lacy-cover.jpg",
                description: `
                    <p><strong>Shoe Size:</strong> 7</p>
                    <p><strong>Age:</strong> 19</p>
                    <p>Loves foot rubs, very ticklish</p>
                    <p><strong>Ever gave a foot job?</strong> Never but willing to try it! LOL</p>
                `
            },
            {
                name: "Jess",
                title: "Size 7.5 • 10 Photo Set",
                img: "jess-cover.jpg",
                description: `
                    <p><strong>Shoe Size:</strong> 7.5</p>
                    <p><strong>Age:</strong> 25</p>
                    <p>Loves Foot Rubs, not ticklish at all</p>
                    <p><strong>Ever gave a foot job?</strong> Yes I had a good little foot boy once he was a good boy ;)</p>
                `
            },
            {
                name: "Jamie",
                title: "Size 8 • 10 Photo Set",
                img: "jamie-cover.jpg",
                description: `
                    <p><strong>Shoe Size:</strong> 8</p>
                    <p><strong>Age:</strong> 30</p>
                    <p>Does enjoy foot rubs, very ticklish</p>
                    <p><strong>Ever gave a foot job?</strong> Yes just once, it was very fun!</p>
                `
            },
            {
                name: "Amy",
                title: "Size 6.5 • 10 Photo Set",
                img: "amy-cover.jpg",
                description: `
                    <p><strong>Shoe Size:</strong> 6.5</p>
                    <p><strong>Age:</strong> 18</p>
                    <p>Does like foot rubs, some ticklish</p>
                    <p><strong>Ever given a foot job?</strong> Almost once but no.</p>
                `
            }
        ];

        let currentModel = null;

        function renderModels() {
            const grid = document.getElementById('models-grid');
            grid.innerHTML = '';

            models.forEach(model => {
                const card = document.createElement('div');
                card.className = "card bg-zinc-900 rounded-3xl overflow-hidden cursor-pointer";
                card.innerHTML = `
                    <img src="${model.img}" class="w-full h-72 object-cover">
                    <div class="p-6">
                        <h3 class="text-2xl font-semibold">${model.name}</h3>
                        <p class="text-zinc-400">${model.title}</p>
                        <button onclick="event.stopImmediatePropagation(); showModel('${model.name}')" 
                                class="mt-6 w-full bg-white text-black py-3 rounded-2xl font-semibold hover:bg-zinc-100">
                            View & Buy
                        </button>
                    </div>
                `;
                card.onclick = () => showModel(model.name);
                grid.appendChild(card);
            });
        }

        function showModel(name) {
            currentModel = models.find(m => m.name === name);
            if (!currentModel) return;

            document.getElementById('modal-name').textContent = currentModel.name;
            document.getElementById('modal-title').textContent = currentModel.title;
            document.getElementById('modal-image').innerHTML = `
                <img src="${currentModel.img}" class="w-full h-full object-cover">
            `;
            document.getElementById('modal-description').innerHTML = currentModel.description;

            document.getElementById('model-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('model-modal').classList.add('hidden');
        }

        function showPayment() {
            closeModal();
            document.getElementById('payment-model').innerHTML = `
                Purchasing <strong>${currentModel.name}'s</strong> 10-Photo Set
            `;
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePayment() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function completePurchase() {
            alert(`✅ Payment Successful!\n\n${currentModel.name}'s 10-Photo Set has been unlocked.\n\nThank you!`);
            closePayment();
        }

        window.onload = renderModels;
    </script>
</body>
</html>
